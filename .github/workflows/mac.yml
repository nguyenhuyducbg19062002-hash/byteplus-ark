# Đóng gói Ark Studio cho macOS (.dmg) trên máy Mac của GitHub mỗi khi đẩy nhãn phiên bản (vd v1.13).
# Ra 2 file: chip Apple (M1/M2/M3/M4) và chip Intel, đính vào trang Release của nhãn đó.
name: Mac build
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['packaging/mac/**', '.github/workflows/mac.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17', cache: maven }
      - uses: actions/setup-node@v5
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Phiên bản
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else
            v=$(sed -n 's:.*<version>\([0-9][0-9.]*\)</version>.*:\1:p' backend/pom.xml | sed -n 2p); fi
          echo "v=$v" >> "$GITHUB_OUTPUT"; echo "Phiên bản $v"
      - name: Đóng gói + chạy thử
        run: |
          set -o pipefail
          if ! SMOKE=1 bash packaging/mac/build-mac.sh "${{ steps.ver.outputs.v }}" "${{ matrix.arch }}" 2>&1 | tee build.log; then
            # log job phải đăng nhập mới xem được → đưa đuôi log ra annotation (xem công khai)
            { printf '::error title=build-mac::'; tail -c 3500 build.log | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; echo; }
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ArkStudio-mac-${{ matrix.arch }}
          path: build-mac/*.dmg
      - name: Đính vào Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          files: build-mac/*.dmg
