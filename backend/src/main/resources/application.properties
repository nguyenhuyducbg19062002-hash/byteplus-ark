# Backend giữ API key / AK/SK nên chỉ nghe trên máy local
server.address=127.0.0.1
server.port=8080

# Ảnh tham chiếu gửi lên dạng base64 trong JSON (BytePlus giới hạn request 64 MB)
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=-1

# Database H2 dạng file (lịch sử file đã tạo, asset, job). Thư mục data\ nằm ở gốc project.
spring.datasource.url=jdbc:h2:file:${app.data-dir:../data}/ark-studio;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Cho phép Vite dev server gọi trực tiếp (khi không dùng proxy)
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,http://[::1]:*

spring.jackson.default-property-inclusion=non_null
logging.level.ark=INFO
